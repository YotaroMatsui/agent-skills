name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.11"

      - name: Run Python unit tests
        run: python -m unittest discover -s skills/layered-japanese-writing/tests -v

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"

      - name: Verify Skills CLI discovery and copy install
        env:
          DISABLE_TELEMETRY: "1"
        run: |
          set -euo pipefail
          discovery_output="$(npx --yes skills@1.5.23 add "$GITHUB_WORKSPACE" --list)"
          printf '%s\n' "$discovery_output"
          [[ "$discovery_output" == *"layered-japanese-writing"* ]]

          install_dir="$(mktemp -d "${RUNNER_TEMP}/skills-smoke.XXXXXX")"
          cd "$install_dir"
          npx --yes skills@1.5.23 add "$GITHUB_WORKSPACE" \
            --skill layered-japanese-writing \
            --agent codex \
            --copy \
            --yes

          installed=".agents/skills/layered-japanese-writing"
          test -f "$installed/SKILL.md"
          test -f "$installed/LICENSE"
          cmp "$GITHUB_WORKSPACE/LICENSE" "$installed/LICENSE"
          python -m unittest discover -s "$installed/tests" -v
